<!doctype html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>तिहार — उज्यालोको कथा</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- first frame of the enter gate, desktop or mobile set by aspect ratio -->
    <link rel="preload" as="fetch" crossorigin href="/frames/s00_enter/d/0001.webp" media="(min-aspect-ratio: 1001/1000)" />
    <link rel="preload" as="fetch" crossorigin href="/frames/s00_enter/m/0001.webp" media="(max-aspect-ratio: 1/1)" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="अँध्यारोमा बलिरहेको माटोको एउटा दियो"></canvas>

    <!-- Scene 0: enter gate -->
    <section id="gate" class="gate" aria-label="प्रवेश">
      <div class="gate__inner">
        <div class="gate__head">
          <h1 class="gate__title">तिहार</h1>
        </div>
        <div class="gate__actions">
          <!-- "your breath": press and hold = the boy breathes in, let go = he blows the diyo out
               (a click / Enter / screen-reader activate plays a full breath) -->
          <button class="breath" type="button" data-enter aria-describedby="breath-hint">
            <span class="breath__circle" aria-hidden="true">
              <span class="breath__glow"></span>
              <!-- the boy's face (traced from the owner's mockup, scripts/trace_boy.py --heads):
                   idle (calm), inhale (head back), hold (cheeks puffed), blow -->
              <span class="breath__boy" data-boy></span>
              <svg class="breath__ring" viewBox="0 0 120 120" focusable="false">
                <circle class="breath__track" cx="60" cy="60" r="56" pathLength="1" />
                <circle class="breath__fill" cx="60" cy="60" r="56" pathLength="1" />
              </svg>
            </span>
            <span class="breath__label">सुरु</span>
          </button>
          <p id="breath-hint" class="breath__hint">थिचिराख्नुहोस्, अनि छोड्नुहोस्</p>
        </div>
      </div>
    </section>

    <!-- sound on/off (HUD, bottom-left; stays after entering). On by default: entering is the
         user gesture that lets audio start. Crossed speaker = off. -->
    <button id="sound" class="sound" type="button" aria-label="आवाज" aria-pressed="true">
      <svg class="sound__icon sound__icon--on" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="sound__icon sound__icon--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>



    <!-- HUD after entering: wordmark (top-left), progress diyos (bottom-right; diyo N lights
         during Scene N+2, so all five stay unlit in Scene 1) -->
    <p class="wordmark" aria-hidden="true">तिहार</p>
    <ol class="diyos" aria-label="तिहारका पाँच दिन">
      <li class="diyo" aria-label="दिन १"><svg viewBox="0 0 32 28" aria-hidden="true" focusable="false"><path class="diyo__flame" d="M16 2c2.6 3.4 3.4 5.8 3.4 7.6A3.4 3.4 0 0 1 16 13a3.4 3.4 0 0 1-3.4-3.4C12.6 7.8 13.4 5.4 16 2z"/><path class="diyo__bowl" d="M3 15.5h26c-.6 5.6-6.2 9.5-13 9.5S3.6 21.1 3 15.5z"/></svg></li>
      <li class="diyo" aria-label="दिन २"><svg viewBox="0 0 32 28" aria-hidden="true" focusable="false"><path class="diyo__flame" d="M16 2c2.6 3.4 3.4 5.8 3.4 7.6A3.4 3.4 0 0 1 16 13a3.4 3.4 0 0 1-3.4-3.4C12.6 7.8 13.4 5.4 16 2z"/><path class="diyo__bowl" d="M3 15.5h26c-.6 5.6-6.2 9.5-13 9.5S3.6 21.1 3 15.5z"/></svg></li>
      <li class="diyo" aria-label="दिन ३"><svg viewBox="0 0 32 28" aria-hidden="true" focusable="false"><path class="diyo__flame" d="M16 2c2.6 3.4 3.4 5.8 3.4 7.6A3.4 3.4 0 0 1 16 13a3.4 3.4 0 0 1-3.4-3.4C12.6 7.8 13.4 5.4 16 2z"/><path class="diyo__bowl" d="M3 15.5h26c-.6 5.6-6.2 9.5-13 9.5S3.6 21.1 3 15.5z"/></svg></li>
      <li class="diyo" aria-label="दिन ४"><svg viewBox="0 0 32 28" aria-hidden="true" focusable="false"><path class="diyo__flame" d="M16 2c2.6 3.4 3.4 5.8 3.4 7.6A3.4 3.4 0 0 1 16 13a3.4 3.4 0 0 1-3.4-3.4C12.6 7.8 13.4 5.4 16 2z"/><path class="diyo__bowl" d="M3 15.5h26c-.6 5.6-6.2 9.5-13 9.5S3.6 21.1 3 15.5z"/></svg></li>
      <li class="diyo" aria-label="दिन ५"><svg viewBox="0 0 32 28" aria-hidden="true" focusable="false"><path class="diyo__flame" d="M16 2c2.6 3.4 3.4 5.8 3.4 7.6A3.4 3.4 0 0 1 16 13a3.4 3.4 0 0 1-3.4-3.4C12.6 7.8 13.4 5.4 16 2z"/><path class="diyo__bowl" d="M3 15.5h26c-.6 5.6-6.2 9.5-13 9.5S3.6 21.1 3 15.5z"/></svg></li>
    </ol>

    <!-- caption block (bottom-centre): real text, read out when it appears -->
    <div id="caption" class="caption" aria-live="polite">
      <p class="caption__label" data-label></p>
      <p class="caption__text" data-text></p>
    </div>

    <!-- shown on the black after entering, until the first scroll -->
    <p id="scroll-cue" class="scroll-cue" aria-hidden="true">
      <span>तल स्क्रोल गर्नुहोस्</span>
      <span class="scroll-cue__line"></span>
    </p>

    <!-- the story: each scene is a tall section whose scroll scrubs its frames on #stage -->
    <main id="story" class="story" aria-label="कथा" tabindex="-1" hidden>
      <section id="s01_hero" class="scene" aria-label="उज्यालोको पर्व"></section>
      <section id="s02_legend" class="scene" aria-label="कथा"></section>
      <section id="s04_kukur" class="scene" aria-label="दिन २ · कुकुर तिहार"></section>
      <section id="s05_laxmi" class="scene" aria-label="दिन ३ · गाई तिहार र लक्ष्मी पूजा"></section>
      <section id="s06_govardhan" class="scene" aria-label="दिन ४ · देउसी"></section>
      <section id="s07_bhaitika" class="scene" aria-label="दिन ५ · भाइटीका"></section>
      <!-- scene 8: no render for this one; the browser draws the valley itself (finale.js) -->
      <section id="s08_finale" class="finale" aria-label="शुभ तिहार">
        <div class="finale__stage" data-stage>
          <img
            class="finale__still"
            src="/frames/s01_hero/d/0110.webp"
            alt="तिहारको रातमा रङ्गीबिरङ्गी बत्तीले झिलिमिली उपत्यका"
            data-still
          />
        </div>
        <p class="finale__line" data-line="1">आज पनि दिदीबहिनीहरू दाजुभाइको लामो आयुका लागि यही प्रार्थना गर्छन्।</p>
        <p class="finale__line" data-line="2">पशुप्रति माया। प्रकृतिप्रति आभार। परिवारको बन्धन। अँध्यारोमाथि उज्यालो।</p>
        <div class="finale__end">
          <h2 class="finale__title">शुभ तिहार</h2>
          <div class="finale__actions">
            <button class="finale__btn" type="button" data-again>फेरि हेर्नुहोस्</button>
          </div>
          <!-- the source, as a mark only: no English is allowed on screen (CLAUDE.md rule 1) -->
          <a
            class="finale__src"
            href="https://github.com/aashishdangal/tihar"
            target="_blank"
            rel="noopener"
            aria-label="यो साइटको स्रोत कोड"
            title="स्रोत कोड"
          >
            <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
          </a>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>तिहार — उज्यालोको कथा</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- first frame of the enter gate, desktop or mobile set by aspect ratio -->
    <link rel="preload" as="fetch" crossorigin href="/frames/s00_enter/d/0001.webp" media="(min-aspect-ratio: 1001/1000)" />
    <link rel="preload" as="fetch" crossorigin href="/frames/s00_enter/m/0001.webp" media="(max-aspect-ratio: 1/1)" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="अँध्यारोमा बलिरहेको माटोको एउटा दियो"></canvas>

    <!-- Scene 0: enter gate -->
    <section id="gate" class="gate" aria-label="प्रवेश">
      <div class="gate__inner">
        <div class="gate__head">
          <h1 class="gate__title">तिहार</h1>
        </div>
        <div class="gate__actions">
          <!-- "light the wick": a small flame runs along the wick on hover/focus; on click the
               wick burns through, then the diyo's flame swells to warm white -->
          <button class="enter" type="button" data-enter>
            <span class="enter__label">सुरु</span>
            <span class="enter__wick" aria-hidden="true">
              <span class="enter__burn"></span>
              <span class="enter__run"><span class="enter__flame"></span></span>
            </span>
          </button>
        </div>
      </div>
    </section>

    <!-- sound on/off (HUD, bottom-left; stays after entering). On by default: entering is the
         user gesture that lets audio start. Crossed speaker = off. -->
    <button id="sound" class="sound" type="button" aria-label="आवाज" aria-pressed="true">
      <svg class="sound__icon sound__icon--on" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="sound__icon sound__icon--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>

    <!-- "Flame swells to warm white": hidden cut into Scene 1 -->
    <div id="swell" class="swell" aria-hidden="true"></div>

    <!-- placeholder until Scene 1 exists -->
    <main id="story" class="story" aria-label="कथा" tabindex="-1" hidden>
      <p class="story__soon">दृश्य १ — तयार हुँदैछ</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
